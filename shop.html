<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - DropCart Africa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">
                    <img src="images/logo.png" alt="DropCart Africa Logo">
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li class="dropdown">
                    <a href="shop.html">Shop</a>
                    <ul class="dropdown-menu">
                        <li><a href="shop.html?category=electronics">Electronics</a></li>
                        <li><a href="shop.html?category=fashion">Fashion</a></li>
                        <li><a href="shop.html?category=home">Home Goods</a></li>
                    </ul>
                </li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="user-actions">
                <a href="login.html" class="btn">Login</a>
                <a href="register.html" class="btn">Register</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="product-grid">
            <h2>Our Products</h2>
            <div class="grid-container">
                <!-- Product cards will be dynamically inserted here -->
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-logo">
                <img src="images/logo.png" alt="DropCart Africa Logo">
            </div>
            <div class="footer-links">
                <ul>
                    <li><a href="terms.html">Terms & Conditions</a></li>
                    <li><a href="privacy.html">Privacy Policy</a></li>
                    <li><a href="refund-policy.html">Refund Policy</a></li>
                </ul>
            </div>
            <div class="footer-social">
                <a href="#"><img src="images/facebook.png" alt="Facebook"></a>
                <a href="#"><img src="images/twitter.png" alt="Twitter"></a>
                <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gridContainer = document.querySelector('.grid-container');
            const products = [
                {
                    name: 'Product 1',
                    image: 'images/product1.jpg',
                    price: '$19.99',
                },
                {
                    name: 'Product 2',
                    image: 'images/product2.jpg',
                    price: '$29.99',
                },
                {
                    name: 'Product 3',
                    image: 'images/product3.jpg',
                    price: '$39.99',
                },
                {
                    name: 'Product 4',
                    image: 'images/product4.jpg',
                    price: '$49.99',
                },
                {
                    name: 'Product 5',
                    image: 'images/product5.jpg',
                    price: '$59.99',
                },
                {
                    name: 'Product 6',
                    image: 'images/product6.jpg',
                    price: '$69.99',
                },
            ];

            products.forEach(product => {
                const productCard = `
                    <div class="product-card">
                        <img src="${product.image}" alt="${product.name}">
                        <div class="product-card-content">
                            <h3>${product.name}</h3>
                            <p>${product.price}</p>
                            <a href="#" class="btn">Add to Cart</a>
                        </div>
                    </div>
                `;
                gridContainer.innerHTML += productCard;
            });
        });
    </script>
</body>
</html>

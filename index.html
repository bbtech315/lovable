<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropCart Africa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">
                    <img src="images/logo.png" alt="DropCart Africa Logo">
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li class="dropdown">
                    <a href="shop.html">Shop</a>
                    <ul class="dropdown-menu">
                        <li><a href="shop.html?category=electronics">Electronics</a></li>
                        <li><a href="shop.html?category=fashion">Fashion</a></li>
                        <li><a href="shop.html?category=home">Home Goods</a></li>
                    </ul>
                </li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="user-actions">
                <a href="login.html" class="btn">Login</a>
                <a href="register.html" class="btn">Register</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Welcome to DropCart Africa</h1>
                <p>Your one-stop shop for everything you need</p>
                <a href="shop.html" class="btn">Shop Now</a>
            </div>
        </section>

        <section class="featured-products">
            <h2>Featured Products</h2>
            <div class="product-slider">
                <!-- Product cards will be dynamically inserted here -->
            </div>
        </section>

        <section class="new-arrivals">
            <h2>New Arrivals</h2>
            <div class="product-slider">
                <!-- Product cards will be dynamically inserted here -->
            </div>
        </section>

        <section class="trending-products">
            <h2>Trending Products</h2>
            <div class="product-slider">
                <!-- Product cards will be dynamically inserted here -->
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-logo">
                <img src="images/logo.png" alt="DropCart Africa Logo">
            </div>
            <div class="footer-links">
                <ul>
                    <li><a href="terms.html">Terms & Conditions</a></li>
                    <li><a href="privacy.html">Privacy Policy</a></li>
                    <li><a href="refund-policy.html">Refund Policy</a></li>
                </ul>
            </div>
            <div class="footer-social">
                <a href="#"><img src="images/facebook.png" alt="Facebook"></a>
                <a href="#"><img src="images/twitter.png" alt="Twitter"></a>
                <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>

</html>
